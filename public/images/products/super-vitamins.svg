<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none">
    <rect width="200" height="280" rx="20" fill="#FFFDF8"/>
    <!-- Frasco / Caja -->
    <rect x="55" y="50" width="90" height="190" rx="12" fill="#FDE047" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="70" y="25" width="60" height="25" rx="6" fill="#F97316"/>
    <!-- Etiqueta -->
    <rect x="63" y="80" width="74" height="135" rx="8" fill="#FFFFFF"/>
